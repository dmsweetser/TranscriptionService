<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Admin Panel — TranscriptionService</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #faf9f7;
            --surface: #ffffff;
            --border: #e8e6e1;
            --text: #2c2c2c;
            --text-dim: #6b6b6b;
            --text-light: #999999;
            --accent: #4a6fa5;
            --accent-light: #e8f0f8;
            --accent-hover: #3a5a8a;
            --green: #5a9e6f;
            --green-light: #e8f5e9;
            --red: #c0392b;
            --red-light: #fde8e6;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.1);
            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --font-display: 'Playfair Display', Georgia, serif;
        }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
        }
        .header {
            padding: 24px 32px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow-sm);
        }
        .header h1 {
            font-family: var(--font-display);
            font-size: 24px;
            font-weight: 600;
            color: var(--text);
        }
        .btn {
            padding: 10px 20px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface);
            color: var(--text);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-family: var(--font);
        }
        .btn:hover:not(:disabled) {
            background: var(--accent-light);
            border-color: var(--accent);
            color: var(--accent);
        }
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }
        .btn-primary:hover:not(:disabled) {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
        }
        .btn-success {
            background: var(--green);
            border-color: var(--green);
            color: white;
        }
        .btn-success:hover:not(:disabled) {
            background: #4a8e5f;
            border-color: #4a8e5f;
        }
        .btn-danger {
            background: var(--red);
            border-color: var(--red);
            color: white;
        }
        .btn-danger:hover:not(:disabled) {
            background: #a83225;
            border-color: #a83225;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 32px;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 28px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-sm);
        }
        .card h2 {
            font-family: var(--font-display);
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--text);
            letter-spacing: -0.01em;
        }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-dim);
            margin-bottom: 8px;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 15px;
            font-family: var(--font);
            transition: all 0.2s;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-light);
        }
        .form-group textarea {
            min-height: 80px;
            resize: vertical;
        }
        .status-badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }
        .status-running {
            background: var(--green-light);
            color: var(--green);
        }
        .status-stopped {
            background: var(--red-light);
            color: var(--red);
        }
        .toast {
            position: fixed;
            top: 24px;
            right: 24px;
            padding: 14px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            z-index: 1000;
            animation: slideIn 0.3s ease;
            box-shadow: var(--shadow-lg);
        }
        .toast.success {
            background: var(--green);
            color: white;
        }
        .toast.error {
            background: var(--red);
            color: white;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .connections-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
        }
        .connection-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            background: var(--bg);
            border-radius: 12px;
            border: 1px solid var(--border);
        }
        .connection-item span:first-child {
            font-size: 14px;
            font-weight: 500;
        }
        .service-control-row {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        @media (max-width: 600px) {
            .container { padding: 20px; }
            .card { padding: 20px; }
            .header { padding: 16px 20px; }
            .header h1 { font-size: 20px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Admin Panel</h1>
        <button class="btn" onclick="logout()">Logout</button>
    </div>

    <div class="container">
        <!-- Service Control -->
        <div class="card">
            <h2>Service Control</h2>
            <div class="service-control-row">
                <button class="btn btn-success" id="startBtn" onclick="controlService('start')">Start Service</button>
                <button class="btn btn-danger" id="stopBtn" onclick="controlService('stop')" disabled>Stop Service</button>
                <span id="serviceStatus" class="status-badge status-stopped">Stopped</span>
            </div>
        </div>

        <!-- Configuration -->
        <div class="card">
            <h2>Configuration</h2>
            <form id="configForm">
                <div class="form-group">
                    <label for="audioDevice">Audio Input Device</label>
                    <select id="audioDevice" disabled>
                        <option>Loading devices...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="assemblyAiKey">Assembly AI API Key</label>
                    <input type="password" id="assemblyAiKey" placeholder="sk_...">
                </div>
                <div class="form-group">
                    <label for="transcriptionPort">Transcription Port</label>
                    <input type="number" id="transcriptionPort" value="5123" min="1" max="65535">
                </div>
                <div class="form-group">
                    <label for="translationPort">Translation Port</label>
                    <input type="number" id="translationPort" value="5001" min="1" max="65535">
                </div>
                <div class="form-group">
                    <label for="biasWords">Bias Words (comma-separated)</label>
                    <textarea id="biasWords" placeholder="transcription,translation,production"></textarea>
                </div>
                <div class="form-group">
                    <label for="saveLocation">Save Location</label>
                    <input type="text" id="saveLocation" value="./transcriptions" placeholder="./transcriptions">
                </div>
                <button type="submit" class="btn btn-primary">Save Configuration</button>
            </form>
        </div>

        <!-- Connection Monitoring -->
        <div class="card">
            <h2>Connection Monitoring</h2>
            <div class="connections-grid" id="connectionsGrid">
                <div class="connection-item">
                    <span>Assembly AI API</span>
                    <span class="status-badge" style="background: var(--bg); color: var(--text-dim);">Checking</span>
                </div>
                <div class="connection-item">
                    <span>Transcription Service</span>
                    <span class="status-badge" style="background: var(--bg); color: var(--text-dim);">Checking</span>
                </div>
                <div class="connection-item">
                    <span>Translation Service</span>
                    <span class="status-badge" style="background: var(--bg); color: var(--text-dim);">Checking</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentServiceRunning = false;
        let savedAudioDevice = null;

        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function updateServiceButtons(isRunning) {
            currentServiceRunning = isRunning;
            document.getElementById('startBtn').disabled = isRunning;
            document.getElementById('stopBtn').disabled = !isRunning;
            const badge = document.getElementById('serviceStatus');
            if (isRunning) {
                badge.className = 'status-badge status-running';
                badge.textContent = 'Running';
            } else {
                badge.className = 'status-badge status-stopped';
                badge.textContent = 'Stopped';
            }
        }

        function controlService(action) {
            const btn = action === 'start' ? document.getElementById('startBtn') : document.getElementById('stopBtn');
            btn.disabled = true;
            const originalText = btn.textContent;
            btn.textContent = '...';

            fetch('/admin/service', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: action })
            })
            .then(r => r.json())
            .then(data => {
                if (data.error) {
                    showToast(data.error, 'error');
                } else {
                    showToast(data.status);
                    updateServiceButtons(action === 'start');
                }
            })
            .catch(err => {
                showToast('Request failed', 'error');
                console.error(err);
            })
            .finally(() => {
                btn.disabled = false;
                btn.textContent = originalText;
            });
        }

        function logout() {
            fetch('/admin/logout', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            }).then(() => window.location.href = '/admin');
        }

        // Load audio devices
        function loadDevices() {
            fetch('/admin/audio_devices')
                .then(r => r.json())
                .then(data => {
                    const select = document.getElementById('audioDevice');
                    select.innerHTML = '';
                    (data.devices || []).forEach(dev => {
                        const option = document.createElement('option');
                        option.value = dev.name || dev;
                        option.text = `${dev.name || dev}${dev.index !== undefined ? ` (Device ${dev.index})` : ''}`;
                        select.appendChild(option);
                    });
                    if (savedAudioDevice) {
                        select.value = savedAudioDevice;
                    } else if (data.devices && data.devices.length > 0) {
                        select.value = data.devices[0].name || data.devices[0];
                    }
                    select.disabled = false;
                })
                .catch(err => {
                    console.error('Failed to load devices:', err);
                    document.getElementById('audioDevice').innerHTML = '<option>Failed to load</option>';
                });
        }

        // Load config
        function loadConfig() {
            fetch('/admin/config')
                .then(r => r.json())
                .then(data => {
                    savedAudioDevice = data.audio_device || null;
                    if (savedAudioDevice) document.getElementById('audioDevice').value = savedAudioDevice;
                    if (data.transcription_port) document.getElementById('transcriptionPort').value = data.transcription_port;
                    if (data.translation_port) document.getElementById('translationPort').value = data.translation_port;
                    if (data.bias_words) document.getElementById('biasWords').value = data.bias_words.join(', ');
                    if (data.save_location) document.getElementById('saveLocation').value = data.save_location;
                    if (data.ASSEMBLYAI_API_KEY) document.getElementById('assemblyAiKey').value = data.ASSEMBLYAI_API_KEY;
                    if (data.service_running) updateServiceButtons(true);
                })
                .catch(err => console.error('Failed to load config:', err));
        }

        // Save config
        document.getElementById('configForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const config = {
                audio_device: document.getElementById('audioDevice').value,
                ASSEMBLYAI_API_KEY: document.getElementById('assemblyAiKey').value,
                transcription_port: document.getElementById('transcriptionPort').value,
                translation_port: document.getElementById('translationPort').value,
                bias_words: document.getElementById('biasWords').value.split(',').map(w => w.trim()).filter(Boolean),
                save_location: document.getElementById('saveLocation').value
            };

            fetch('/admin/config', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(config)
            })
            .then(r => r.json())
            .then(data => {
                if (data.error) {
                    showToast(data.error, 'error');
                } else {
                    showToast(data.status);
                }
            })
            .catch(err => {
                showToast('Request failed', 'error');
                console.error(err);
            });
        });

        // Periodic health check
        function checkHealth() {
            fetch('/health')
                .then(r => r.json())
                .then(data => {
                    if (data.service_running && !currentServiceRunning) {
                        updateServiceButtons(true);
                    } else if (!data.service_running && currentServiceRunning) {
                        updateServiceButtons(false);
                    }
                })
                .catch(() => {});
        }

        // Initialize
        loadConfig();
        loadDevices();
        setInterval(checkHealth, 5000);
    </script>
</body>
</html>
