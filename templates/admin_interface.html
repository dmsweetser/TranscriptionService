<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transcription Service - Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center">Transcription Service - Admin Panel</h1>
        
        <div class="row mt-4">
            <div class="col-md-12">
                <h3>Service Control</h3>
                <button class="btn btn-success me-2" id="startBtn" onclick="controlService('start')">Start Service</button>
                <button class="btn btn-danger me-2" id="stopBtn" onclick="controlService('stop')" disabled>Stop Service</button>
                <button class="btn btn-info" onclick="logout()">Logout</button>
            </div>
        </div>
        
        <div class="row mt-4">
            <div class="col-md-12">
                <h3>Configuration</h3>
                <div class="card">
                    <div class="card-body">
                        <form id="configForm">
                            <div class="mb-3">
                                <label for="audioDevice" class="form-label">Audio Input Device</label>
                                <select class="form-select" id="audioDevice" disabled>
                                    <option value="">Loading devices...</option>
                                </select>
                            </div>
                            
                            <div class="mb-3">
                                <label for="transcriptionPort" class="form-label">Transcription Port</label>
                                <input type="number" class="form-control" id="transcriptionPort" value="5000">
                            </div>
                            
                            <div class="mb-3">
                                <label for="translationPort" class="form-label">Translation Port</label>
                                <input type="number" class="form-control" id="translationPort" value="5001">
                            </div>
                            
                            <div class="mb-3">
                                <label for="biasWords" class="form-label">Bias Words (comma separated)</label>
                                <input type="text" class="form-control" id="biasWords" value="transcription,translation">
                            </div>
                            
                            <div class="mb-3">
                                <label for="saveLocation" class="form-label">Save Location</label>
                                <input type="text" class="form-control" id="saveLocation" value="./transcriptions">
                            </div>
                            
                            <button type="submit" class="btn btn-primary">Save Configuration</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="row mt-4">
            <div class="col-md-12">
                <h3>Connection Monitoring</h3>
                <div class="card">
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6">
                                <h5>Internal Connections</h5>
                                <ul class="list-group" id="internalConnections">
                                    <li class="list-group-item">Assembly AI API <span class="badge bg-secondary float-end">Checking</span></li>
                                    <li class="list-group-item">Transcription Service <span class="badge bg-secondary float-end">Checking</span></li>
                                    <li class="list-group-item">Translation Service <span class="badge bg-secondary float-end">Checking</span></li>
                                </ul>
                            </div>
                            <div class="col-md-6">
                                <h5>External Connections</h5>
                                <ul class="list-group" id="externalConnections">
                                    <li class="list-group-item">User Interface 1 <span class="badge bg-secondary float-end">Checking</span></li>
                                    <li class="list-group-item">User Interface 2 <span class="badge bg-secondary float-end">Checking</span></li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function controlService(action) {
            fetch('/admin/service', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({action: action})
            })
            .then(response => response.json())
            .then(data => {
                alert(data.status);
                updateServiceButtons(action === 'start');
            });
        }

        function updateServiceButtons(isRunning) {
            document.getElementById('startBtn').disabled = isRunning;
            document.getElementById('stopBtn').disabled = !isRunning;
        }

        function logout() {
            fetch('/admin/logout', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            })
            .then(response => response.json())
            .then(data => {
                window.location.href = '/admin';
            });
        }

        document.getElementById('configForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const config = {
                audio_device: document.getElementById('audioDevice').value,
                transcription_port: document.getElementById('transcriptionPort').value,
                translation_port: document.getElementById('translationPort').value,
                bias_words: document.getElementById('biasWords').value.split(','),
                save_location: document.getElementById('saveLocation').value
            };
            fetch('/admin/config', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(config)
            })
            .then(response => response.json())
            .then(data => {
                alert(data.status || data.error);
            });
        });

        function loadConfig() {
            fetch('/admin/config')
            .then(response => response.json())
            .then(data => {
                if (data.audio_device) document.getElementById('audioDevice').value = data.audio_device;
                if (data.transcription_port) document.getElementById('transcriptionPort').value = data.transcription_port;
                if (data.translation_port) document.getElementById('translationPort').value = data.translation_port;
                if (data.bias_words) document.getElementById('biasWords').value = data.bias_words.join(',');
                if (data.save_location) document.getElementById('saveLocation').value = data.save_location;
                document.getElementById('audioDevice').disabled = false;
            })
            .catch(err => console.error('Failed to load config:', err));
        }

        function loadDevices() {
            fetch('/api/audio_devices')
            .then(response => response.json())
            .then(data => {
                const select = document.getElementById('audioDevice');
                select.innerHTML = '';
                data.devices.forEach(dev => {
                    const option = document.createElement('option');
                    option.value = dev;
                    option.text = dev;
                    select.appendChild(option);
                });
            });
        }

        loadConfig();
        loadDevices();
    </script>
</body>
</html>
