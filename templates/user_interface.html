<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Live Transcription</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #faf9f7;
            --surface: #ffffff;
            --border: #e8e6e1;
            --text: #2c2c2c;
            --text-dim: #6b6b6b;
            --text-light: #999999;
            --accent: #4a6fa5;
            --accent-light: #e8f0f8;
            --accent-hover: #3a5a8a;
            --green: #5a9e6f;
            --green-light: #e8f5e9;
            --red: #c0392b;
            --red-light: #fde8e6;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.1);
            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --font-display: 'Playfair Display', Georgia, serif;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.6;
        }

        /* Header */
        .header {
            padding: 24px 32px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 10;
            box-shadow: var(--shadow-sm);
        }

        .header h1 {
            font-family: var(--font-display);
            font-size: 24px;
            font-weight: 600;
            color: var(--text);
            letter-spacing: -0.01em;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: var(--text-dim);
            font-weight: 500;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--red);
            transition: background 0.3s;
            box-shadow: 0 0 0 2px var(--red-light);
        }

        .status-dot.connected {
            background: var(--green);
            box-shadow: 0 0 0 2px var(--green-light);
        }

        /* Language tabs */
        .lang-tabs {
            display: flex;
            gap: 8px;
            padding: 16px 32px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            box-shadow: var(--shadow-sm);
        }

        .lang-tab {
            padding: 10px 20px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-dim);
            font-size: 14px;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
            font-family: var(--font);
        }

        .lang-tab:hover {
            background: var(--accent-light);
            color: var(--accent);
            border-color: var(--accent);
        }

        .lang-tab.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        /* Transcription area */
        .transcription-area {
            flex: 1;
            overflow-y: auto;
            padding: 32px;
            scroll-behavior: smooth;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }

        .sentence {
            padding: 16px 20px;
            margin-bottom: 12px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 17px;
            line-height: 1.7;
            animation: fadeIn 0.4s ease;
            word-wrap: break-word;
            overflow-wrap: break-word;
            box-shadow: var(--shadow-sm);
        }

        .sentence.translation {
            border-left: 4px solid var(--accent);
            font-size: 15px;
            color: var(--text-dim);
            background: var(--accent-light);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .placeholder {
            text-align: center;
            color: var(--text-light);
            padding: 80px 20px;
            font-size: 16px;
            font-style: italic;
        }

        /* Footer */
        .footer {
            padding: 20px 32px;
            background: var(--surface);
            border-top: 1px solid var(--border);
            text-align: center;
            font-size: 13px;
            color: var(--text-light);
        }

        /* Responsive */
        @media (max-width: 600px) {
            .header { padding: 16px 20px; }
            .header h1 { font-size: 20px; }
            .lang-tabs { padding: 12px 20px; }
            .sentence { font-size: 16px; padding: 14px 16px; }
            .transcription-area { padding: 20px; }
            .footer { padding: 16px 20px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 id="pageTitle">Live Transcription</h1>
        <div class="status">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">Connecting...</span>
        </div>
    </div>

    <div class="lang-tabs" id="langTabs">
        <button class="lang-tab active" data-lang="English">English</button>
        <button class="lang-tab" data-lang="French">French</button>
        <button class="lang-tab" data-lang="Spanish">Spanish</button>
        <button class="lang-tab" data-lang="Arabic">Arabic</button>
        <button class="lang-tab" data-lang="German">German</button>
        <button class="lang-tab" data-lang="Italian">Italian</button>
        <button class="lang-tab" data-lang="Japanese">Japanese</button>
        <button class="lang-tab" data-lang="Korean">Korean</button>
    </div>

    <div class="transcription-area" id="transcriptionArea">
        <div class="placeholder">Waiting for transcription...</div>
    </div>

    <div class="footer">
        TranscriptionService &middot; Scroll up for history &middot; Auto-scrolls when at bottom
    </div>

    <script>
        const area = document.getElementById('transcriptionArea');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const langTabs = document.getElementById('langTabs');
        const pageTitle = document.getElementById('pageTitle');

        let currentLang = 'English';
        let transcriptionSource = null;
        let reconnectTimer = null;
        let atBottom = true;
        let hasContent = false;

        // Track translations we've already displayed to avoid duplicates
        let displayedTranslations = new Set();

        // Detect if user is at bottom
        function checkBottom() {
            const threshold = 50;
            atBottom = (area.scrollTop + area.clientHeight >= area.scrollHeight - threshold);
        }

        function scrollToBottom() {
            if (atBottom) {
                area.scrollTop = area.scrollHeight;
            }
        }

        // Auto-scroll on new content
        function appendSentence(html, isTranslation = false) {
            // Remove placeholder on first content
            if (!hasContent) {
                area.innerHTML = '';
                hasContent = true;
            }

            const p = document.createElement('div');
            p.className = 'sentence' + (isTranslation ? ' translation' : '');
            p.innerHTML = html;
            area.appendChild(p);

            // Keep max 200 sentences to prevent memory issues
            while (area.children.length > 200) {
                area.removeChild(area.firstChild);
            }

            scrollToBottom();
        }

        // Language tab switching
        langTabs.addEventListener('click', (e) => {
            if (!e.target.classList.contains('lang-tab')) return;
            langTabs.querySelector('.active').classList.remove('active');
            e.target.classList.add('active');
            currentLang = e.target.dataset.lang;
            pageTitle.textContent = `Live ${currentLang} Transcription`;
            // Clear displayed translations for the new language
            displayedTranslations.clear();
        });

        // Scroll handling
        area.addEventListener('scroll', checkBottom);

        // Resume auto-scroll on touch/click at bottom
        area.addEventListener('touchstart', checkBottom);
        area.addEventListener('mousedown', checkBottom);

        // Reconnect logic
        function scheduleReconnect() {
            if (reconnectTimer) return;
            reconnectTimer = setTimeout(() => {
                reconnectTimer = null;
                startStreams();
            }, 3000);
        }

        function startTranscriptionStream() {
            if (transcriptionSource) {
                transcriptionSource.close();
            }
            transcriptionSource = new EventSource('/api/transcription/stream');

            transcriptionSource.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === 'transcription') {
                        statusDot.classList.add('connected');
                        statusText.textContent = 'Connected';
                        appendSentence(escapeHtml(data.text));
                    } else if (data.type === 'translation') {
                        // Only show translations for the currently selected language
                        if (data.lang === currentLang) {
                            // Deduplicate: skip if we've already shown this exact translation
                            const key = `${data.lang}:${data.text}`;
                            if (displayedTranslations.has(key)) return;
                            displayedTranslations.add(key);
                            // Cap the set to prevent memory issues
                            if (displayedTranslations.size > 100) {
                                const arr = [...displayedTranslations];
                                displayedTranslations = new Set(arr.slice(-50));
                            }
                            statusText.textContent = `Connected — ${currentLang}`;
                            appendSentence(escapeHtml(data.text), true);
                        }
                    }
                } catch (e) {
                    // ignore parse errors (keepalive etc)
                }
            };

            transcriptionSource.onerror = () => {
                statusDot.classList.remove('connected');
                statusText.textContent = 'Reconnecting...';
                scheduleReconnect();
            };
        }

        function startStreams() {
            startTranscriptionStream();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Start on load
        startStreams();
    </script>
</body>
</html>
