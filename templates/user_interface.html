<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transcription Service - User Interface</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center">Transcription Service</h1>
        
        <div class="row mt-4">
            <div class="col-md-6">
                <h3>Transcription Stream</h3>
                <div id="transcription" class="border p-3 bg-light">
                    <!-- Transcription content will appear here -->
                    <p>Waiting for transcription...</p>
                </div>
            </div>
            
            <div class="col-md-6">
                <h3>Translation Stream</h3>
                <div id="translation" class="border p-3 bg-light">
                    <!-- Translation content will appear here -->
                    <p>Waiting for translation...</p>
                </div>
            </div>
        </div>
        
        <div class="row mt-4">
            <div class="col-12">
                <h3>Language Selection</h3>
                <div class="btn-group" role="group">
                    <button type="button" class="btn btn-outline-primary">English</button>
                    <button type="button" class="btn btn-outline-primary">French</button>
                    <button type="button" class="btn btn-outline-primary">Spanish</button>
                    <button type="button" class="btn btn-outline-primary">Arabic</button>
                </div>
            </div>
        </div>
        
        <div class="row mt-4">
            <div class="col-12">
                <h3>QR Code Access</h3>
                <div class="text-center">
                    <img src="https://via.placeholder.com/150" alt="QR Code" class="img-thumbnail">
                    <p>Scan this QR code to access the stream</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
